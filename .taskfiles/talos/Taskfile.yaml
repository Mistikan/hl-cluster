---
version: '3'

tasks:

  render:
    desc: Render Talos machine configs into talos/output (contains secrets, gitignored)
    dir: '{{.TALOS_DIR}}'
    cmd: topf render -o output
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf sops

  render-check:
    internal: true
    dir: '{{.TALOS_DIR}}'
    cmd: out="$(mktemp -d)" && topf render -o "$out" > /dev/null; rc=$?; rm -rf "$out"; exit $rc
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf

  apply:
    desc: Apply Talos config to the nodes [MODE=auto|no-reboot|staged|reboot] [DRY_RUN=true]
    dir: '{{.TALOS_DIR}}'
    # With --dry-run topf exits with 2 when changes are detected
    cmd: topf apply --mode={{.MODE}} {{if eq .DRY_RUN "true"}}--dry-run || test $? -eq 2{{end}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
      DRY_RUN: '{{.DRY_RUN | default "false"}}'
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf sops

  upgrade:
    desc: Upgrade Talos to talosVersion from talos/topf.yaml [DRY_RUN=true]
    dir: '{{.TALOS_DIR}}'
    # Single-node cluster: draining would only evict pods with nowhere to go
    cmd: topf upgrade --drain=false {{if eq .DRY_RUN "true"}}--dry-run{{end}}
    vars:
      DRY_RUN: '{{.DRY_RUN | default "false"}}'
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf sops

  upgrade-k8s:
    desc: Upgrade Kubernetes to kubernetesVersion from talos/topf.yaml
    cmd: talosctl --nodes {{.CONTROLLER}} upgrade-k8s --to {{.KUBERNETES_VERSION}}
    vars:
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/topf.yaml
      CONTROLLER:
        sh: yq '[.nodes[] | select(.role == "control-plane")][0].ip' {{.TALOS_DIR}}/topf.yaml
    preconditions:
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq

  talosconfig:
    desc: Regenerate talosconfig from the secrets bundle
    dir: '{{.TALOS_DIR}}'
    cmd: topf talosconfig > {{.TALOSCONFIG}}
    preconditions:
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf sops

  reset:
    desc: Resets nodes back to maintenance mode
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf reset --full={{if .CLI_FORCE}}true{{else}}false{{end}}
    preconditions:
      - which topf
