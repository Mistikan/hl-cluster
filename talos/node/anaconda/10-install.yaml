apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.serial == "50026B76862410D9"
  wipe: false
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: zfs
---
# Inside a privileged container: mount -t debugfs none /sys/kernel/debug
# after which /sys/kernel/debug/pmc_core/ becomes available
apiVersion: v1alpha1
kind: KernelModuleConfig
name: intel_pmc_core
# ---
# apiVersion: v1alpha1
# kind: KernelModuleConfig
# name: it87
# parameters:
#   - ignore_resource_conflict=1
#   - force_id=0x8628
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nfs
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nfsd
---
# Нужен, чтобы virt-handler забрал устройства у хостовых драйверов (nvme, amdgpu).
apiVersion: v1alpha1
kind: KernelModuleConfig
name: vfio_pci
---
apiVersion: v1alpha1
kind: PCIDriverRebindConfig
name: "0000:04:00.0"
targetDriver: vfio-pci
---
# Radeon RX 7600: VGA 03:00.0 (1002:7480) и HDMI/DP audio 03:00.1 (1002:ab30).
apiVersion: v1alpha1
kind: PCIDriverRebindConfig
name: "0000:03:00.0"
targetDriver: vfio-pci
---
apiVersion: v1alpha1
kind: PCIDriverRebindConfig
name: "0000:03:00.1"
targetDriver: vfio-pci
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: vfio_iommu_type1

