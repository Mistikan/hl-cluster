---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v4.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
  namespace: kube-system
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  suspend: false
  values:
    defaultPodOptions:
      priorityClassName: system-node-critical

    controllers:
      generic-device-plugin:
        type: daemonset
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/squat/generic-device-plugin
              tag: latest@sha256:dc192e164c69b03f156765793a1be62ca437709ae477b27ca7d8f3dcf5021576
            args:
              - --log-level=info
              - --domain=generic-device-plugin
              - --device
              - |
                name: zfs
                groups:
                  - paths:
                      - path: /dev/zfs
                        mountPath: /dev/zfs

            ports:
              - containerPort: 8080
                name: http

            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi

    persistence:
      dev:
        type: hostPath
        hostPath: /dev
      sys:
        type: hostPath
        hostPath: /sys
        globalMounts:
          - readOnly: true
      var-lib-kubelet-device-plugins:
        type: hostPath
        hostPath: /var/lib/kubelet/device-plugins
