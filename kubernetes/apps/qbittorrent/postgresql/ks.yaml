---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgresql
  namespace: qbittorrent
spec:
  interval: 1h
  path: ./kubernetes/apps/qbittorrent/postgresql/app
  # postBuild:
  #   substituteFrom:
  #     - name: cluster-secrets
  #       kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: qbittorrent
  wait: false
