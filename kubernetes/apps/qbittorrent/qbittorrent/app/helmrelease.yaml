---
# TODO: это должно быть через fluxcd, а не как сейчас
# https://github.com/onedr0p/home-ops/blob/main/kubernetes/apps/default/qbittorrent/app/helmrelease.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  # TODO: поставить 1h
  interval: 1m
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      qbittorrent:
        # TODO: поставить 1
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
            # command: ["/bin/bash"]
            # args: ["-c", "sleep inf"]
            env:
              TZ: Europe/Moscow
              QBT_WEBUI_PORT: &port 80
              QBT_TORRENTING_PORT: &torrentPort 50413
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
              # limits:
              #   memory: 8Gi
          qbt:
            image:
              repository: ghcr.io/trueforge-org/qbittorrent
              tag: 5.2.3@sha256:8929ad12c4b0e7cddb77b4de7fb250c8d6b68881494fcac7679a284de0510d99
            command: ["/bin/bash"]
            args: ["-c", "sleep inf"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "lan",
            "namespace": "kube-system",
            "ips": ["192.168.88.250/24"],
            "mac": "32:0b:d8:1f:b6:e9"
          }]
    service:
      app:
        controller: qbittorrent
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.88.103"
        ports:
          http:
            primary: true
            port: *port
          bittorrent:
            enabled: true
            port: *torrentPort
            protocol: TCP
    # route:
    #   app:
    #     hostnames:
    #       - "{{ .Release.Name }}.devbu.io"
    #       - qb.devbu.io
    #     parentRefs:
    #       - name: internal
    #         namespace: kube-system
    #         sectionName: https
    #     rules:
    #       - backendRefs:
    #           - name: *app
    #             port: *port
    persistence:
      config:
        existingClaim: qbittorrent
      qbt-cli:
        type: configMap
        name: qbittorrent-qbt
        advancedMounts:
          qbittorrent:
            qbt:
              - path: /config/.config/qbt/.qbt.toml
                subPath: qbt.toml
                readOnly: true
              - path: /scripts/add-metadata.sh
                subPath: add-metadata.sh
                readOnly: true
      # scripts:
      #   type: configMap
      #   name: qbittorrent-scripts
      #   defaultMode: 0775
      #   globalMounts:
      #     - readOnly: true
      # media-wd-green:
      #   type: hostPath
      #   hostPath: /var/mnt/zfs/wd_green_1tb_pool/torrent
      #   globalMounts:
      #     - path: /media/zfs/wd_green_1tb_pool
      #       # TODO: раскомментировать, когда скачаю всё и диск будет только для раздачи
      #       # readOnly: true
      # media-wd-blue:
      #   existingClaim: wd-blue-1tb-pool-torrent-pvc
      #   globalMounts:
      #     - path: /media/zfs/wd_blue_1tb_pool
      #       # TODO: раскомментировать, когда скачаю всё и диск будет только для раздачи
      #       # readOnly: true
      media-seagate-barracuda:
        existingClaim: "nfs-seagate-barracuda-2tb-pool-torrent-pvc"
        globalMounts:
          - path: "/media/zfs/seagate_barracuda_2tb_pool"
            # TODO: раскомментировать, когда скачаю всё и диск будет только для раздачи
            # readOnly: true
      tmp:
        type: emptyDir
