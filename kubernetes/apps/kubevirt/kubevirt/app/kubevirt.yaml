---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates:
        - HostDevices
        - Sidecar
    imagePullPolicy: IfNotPresent
    permittedHostDevices:
      pciHostDevices:
        # Kingston NV3 SNV3S1000G. Не путать с KC3000 (2646:5013), на котором пул ZFS storage.
        - pciVendorSelector: "2646:5025"
          resourceName: kubevirt.io/kingston-snv3s1000g
        # Sapphire Radeon RX 7600 (Navi 33): VGA и HDMI/DP audio одной карты.
        - pciVendorSelector: "1002:7480"
          resourceName: kubevirt.io/radeon-rx-7600
        - pciVendorSelector: "1002:ab30"
          resourceName: kubevirt.io/radeon-rx-7600-audio
      usb:
        # Genesys Logic USB 2.0 hub на физическом порту 1-9.
        - resourceName: kubevirt.io/usb2-hub
          selectors:
            - vendor: "05e3"
              product: "0608"
        # Genesys Logic USB 2.1 hub на физическом порту 1-3.
        - resourceName: kubevirt.io/usb21-hub
          selectors:
            - vendor: "05e3"
              product: "0610"
    smbios:
      sku: "TalosCloud"
      version: "v0.1.0"
      manufacturer: "Talos Virtualization"
      product: "talosvm"
      family: "ccio"
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  infra:
    replicas: 1
  workloadUpdateStrategy: {}
