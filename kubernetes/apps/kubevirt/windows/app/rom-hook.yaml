---
apiVersion: v1
kind: ConfigMap
metadata:
  name: windows-dummy-rom-hook
data:
  onDefineDomain.sh: |
    #!/bin/sh
    set -eu

    rom=/rom/nv33-pci.rom
    if [ ! -f "$rom" ] ; then
      echo "missing $rom" >&2
      exit 1
    fi

    domain_xml=$(mktemp)
    printf '%s' "$4" > "$domain_xml"
    sed -i \
      '/<alias name="ua-gpu-radeon-rx-7600"/i\      <rom bar="on" file="/rom/nv33-pci.rom"/>' \
      "$domain_xml"

    if [ "$(grep -c 'file="/rom/nv33-pci.rom"' "$domain_xml")" -ne 1 ]; then
      echo "failed to attach nv33-pci ROM to Radeon RX 7600" >&2
      exit 1
    fi

    cat "$domain_xml"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: windows-dummy-rom
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-zfs-kingston
  resources:
    requests:
      storage: 16Mi
