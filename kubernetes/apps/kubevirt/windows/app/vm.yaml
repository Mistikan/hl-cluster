---
# Windows стоит на Kingston NV3 SNV3S1000G. В гостя уходит весь NVMe (PCI 2646:5025),
# чтобы загрузчик увидел тот же контроллер, что и на железе.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: windows
spec:
  # runStrategy: Always
  runStrategy: Manual
  template:
    metadata:
      annotations:
        hooks.kubevirt.io/hookSidecars: >-
          [{"args":["--version","v1alpha2"],"configMap":{"name":"windows-dummy-rom-hook","key":"onDefineDomain.sh","hookPath":"/usr/bin/onDefineDomain"},"pvc":{"name":"windows-dummy-rom","volumePath":"/rom","sharedComputePath":"/rom"}}]
      labels:
        kubevirt.io/domain: windows
    spec:
      nodeSelector:
        kubernetes.io/hostname: anaconda
      domain:
        machine:
          type: q35
        firmware:
          bootloader:
            efi:
              secureBoot: false
        cpu:
          cores: 4
          model: host-passthrough
        features:
          hyperv:
            relaxed: {}
            vapic: {}
            spinlocks:
              spinlocks: 8191
            vpindex: {}
            runtime: {}
            synic: {}
            synictimer: {}
            vendorid:
              vendorid: 9ceac4f2f302
            frequencies: {}
            tlbflush: {}
            ipi: {}
            evmcs: {}
          kvm:
            hidden: true
        clock:
          timer:
            rtc:
              tickPolicy: catchup
            pit:
              tickPolicy: delay
            hpet:
              present: false
            hyperv:
              present: true
        resources:
          requests:
            memory: 8Gi
        devices:
          # QEMU не принимает display=on/ramfb на этой карте:
          # vfio 0000:03:00.0: device doesn't support any (known) display method.
          # HDMI зажигает гостевой драйвер AMD, а не VNC-display KubeVirt.
          autoattachGraphicsDevice: false
          interfaces:
            - name: default
              model: e1000e
              masquerade: {}
          gpus:
            - name: radeon-rx-7600
              deviceName: kubevirt.io/radeon-rx-7600
          hostDevices:
            - name: kingston-snv3s1000g
              deviceName: kubevirt.io/kingston-snv3s1000g
            - name: radeon-rx-7600-audio
              deviceName: kubevirt.io/radeon-rx-7600-audio
            - name: usb2-hub
              deviceName: kubevirt.io/usb2-hub
            - name: usb21-hub
              deviceName: kubevirt.io/usb21-hub
      networks:
        - name: default
          pod: {}
