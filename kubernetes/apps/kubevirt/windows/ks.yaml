---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: windows
spec:
  dependsOn:
    - name: kubevirt
  interval: 1h
  path: ./kubernetes/apps/kubevirt/windows/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
